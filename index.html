<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShotMeld - 照片管理系统</title>
    <meta name="description" content="ShotMeld是一个照片管理应用，让您轻松管理、分类和分享您的照片和回忆。" />
    
    <!-- Favicon 配置 -->
    <!-- SVG favicon (现代浏览器推荐，支持暗色模式适配) -->
    <link rel="icon" type="image/svg+xml" href="/LOGO_bg/icon_bg.svg" />
    <!-- 传统 favicon 作为后备 -->
    <link rel="icon" type="image/x-icon" href="/LOGO_bg/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/LOGO_bg/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/LOGO_bg/favicon-32x32.png" />
    
    <!-- Apple 设备图标 -->
    <link rel="apple-touch-icon" sizes="180x180" href="/LOGO_bg/apple-touch-icon.png" />

    <!-- Android Chrome 图标 -->
    <link rel="icon" type="image/png" sizes="192x192" href="/LOGO_bg/android-chrome-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/LOGO_bg/android-chrome-512x512.png" />
    
    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ShotMeld" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.font.im/css?family=Dancing+Script" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
